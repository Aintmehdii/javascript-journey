<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="maintest.js"></script>
</head>
<body>
    <h1 id="title">🎮 Gaming Dashboard</h1>

    <button id="themeBtn">🌙 Dark Mode</button>

    <section id="profile">
        <h2>Player Profile</h2>
        <p id="usernameDisplay">Username: Guest</p>
        <p id="levelDisplay">Level: 1</p>
        <p id="coinsDisplay">Coins: 0</p>
        <p id="statusDisplay">Offline 🔴</p>

        <input id="usernameInput" placeholder="Enter username">
        <button id="saveProfileBtn">Save Username</button>

        <button id="levelUpBtn">Level Up</button>
        <button id="coinsBtn">Earn 100 Coins</button>
        <button id="statusBtn">Toggle Online</button>
    </section>

    <hr>

    <section>
        <h2>My Games</h2>
        <input id="gameInput" placeholder="Enter a game name">
        <button id="addGameBtn">Add Game</button>
        <div id="gameList"></div>
    </section>

    <hr>

    <section>
        <h2>Login</h2>
        <form id="loginForm">
            <input id="loginInput" placeholder="Username">
            <input id="passwordInput" type="password"
                   placeholder="Password">
            <button type="submit">Login</button>
        </form>
        <p id="loginMessage"></p>
    </section>

    <hr>

    <section>
        <h2>Keyboard Controller</h2>
        <p>↑ Level up | ↓ Lose 1 level | Enter: Login | Escape: Logout</p>
        <p id="keyboardMessage">Press a key...</p>
    </section>

    <hr>

    <section>
        <h2>Mouse Controller</h2>
        <div id="mouseArea">Move your mouse here!</div>
        <p id="mouseMessage">Mouse hasn't entered yet.</p>
        <p id="mousePosition">X: 0, Y: 0</p>
    </section>
</body>
</html>
